<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background dengan rounded corners -->
  <rect width="512" height="512" rx="64" ry="64" fill="#3B82F6"/>
  
  <!-- Karakter anime Mikasa -->
  <!-- Kepala -->
  <circle cx="256" cy="180" r="80" fill="#FFFFFF"/>
  
  <!-- Rambut biru muda -->
  <path d="M 200 140 Q 200 120 220 120 L 292 120 Q 312 120 312 140 L 312 160 Q 312 180 292 180 L 220 180 Q 200 180 200 160 Z" fill="#7DD3FC"/>
  
  <!-- Simbol planet di rambut -->
  <circle cx="220" cy="150" r="12" fill="#3B82F6"/>
  <circle cx="220" cy="150" r="8" fill="#7DD3FC"/>
  
  <!-- Mata -->
  <circle cx="240" cy="170" r="8" fill="#3B82F6"/>
  <circle cx="272" cy="170" r="8" fill="#3B82F6"/>
  
  <!-- Pupil mata -->
  <circle cx="240" cy="170" r="4" fill="#1E40AF"/>
  <circle cx="272" cy="170" r="4" fill="#1E40AF"/>
  
  <!-- Alis -->
  <path d="M 230 160 Q 240 155 250 160" stroke="#1E40AF" stroke-width="3" fill="none"/>
  <path d="M 262 160 Q 272 155 282 160" stroke="#1E40AF" stroke-width="3" fill="none"/>
  
  <!-- Hidung -->
  <circle cx="256" cy="185" r="2" fill="#1E40AF"/>
  
  <!-- Mulut -->
  <path d="M 246 195 Q 256 200 266 195" stroke="#1E40AF" stroke-width="2" fill="none"/>
  
  <!-- Badan (armor futuristik) -->
  <rect x="200" y="260" width="112" height="120" rx="16" fill="#FFFFFF"/>
  
  <!-- Detail armor -->
  <rect x="210" y="270" width="92" height="100" rx="8" fill="#7DD3FC"/>
  
  <!-- Simbol Q di dada -->
  <circle cx="256" cy="320" r="20" fill="#3B82F6"/>
  <text x="256" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF">Q</text>
  
  <!-- Lingkaran di sisi kiri -->
  <circle cx="220" cy="320" r="15" fill="#7DD3FC"/>
  <circle cx="220" cy="320" r="10" fill="#3B82F6"/>
  
  <!-- Detail armor lainnya -->
  <rect x="200" y="380" width="112" height="20" rx="10" fill="#1E40AF"/>
  
  <!-- Tangan -->
  <circle cx="180" cy="300" r="15" fill="#FFFFFF"/>
  <circle cx="332" cy="300" r="15" fill="#FFFFFF"/>
  
  <!-- Detail tangan -->
  <circle cx="180" cy="300" r="10" fill="#7DD3FC"/>
  <circle cx="332" cy="300" r="10" fill="#7DD3FC"/>
</svg>
